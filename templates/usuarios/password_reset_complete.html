{% extends 'layouts/auth_base.html' %}
{% load static %}

{% block title %}Contraseña cambiada | UrbanReport{% endblock %}

{% block auth_card %}
<div class="auth-card auth-status-card">
  <div class="auth-status-icon" style="background: rgba(34,197,94,0.15); color:#22c55e;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
  </div>
  <h2 class="auth-status-title">¡Contraseña actualizada!</h2>
  <p class="auth-status-text">
    Tu contraseña fue cambiada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.
  </p>
  <a href="{% url 'login' %}" class="btn-primary auth-status-btn">Iniciar sesión</a>
</div>
{% endblock %}
