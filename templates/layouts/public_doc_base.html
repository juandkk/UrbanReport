{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/portal.css' %}">
<link rel="stylesheet" href="{% static 'css/guia.css' %}">
{% endblock %}

{% block content %}
<div class="public-doc-wrapper">
  <header class="public-doc-topbar">
    <div class="public-doc-topbar-inner">
      <a href="{% if user.is_authenticated %}{% url 'feed_comunitario' %}{% else %}{% url 'login' %}{% endif %}" class="sidebar-logo" style="text-decoration: none;">
        <svg class="brand-icon-svg" viewBox="0 0 24 24" fill="none" style="width: 26px; height: 26px;">
          <path d="M3 21H21" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5 21V7L13 3V21" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M19 21V11L13 7" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 9V9.01" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 12V12.01" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 15V15.01" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 18V18.01" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span style="font-weight: 700; font-size: 1.15rem; color: #ffffff;">UrbanReport</span>
      </a>
      <div class="public-doc-actions">
        {% if user.is_authenticated %}
          <a href="{% url 'completar_perfil' %}" class="public-doc-btn public-doc-btn-primary">Volver a mi perfil</a>
          <a href="{% url 'logout' %}" class="public-doc-btn">Cerrar sesión</a>
        {% else %}
          <a href="{% url 'login' %}" class="public-doc-btn">Iniciar Sesión</a>
          <a href="{% url 'registro' %}" class="public-doc-btn public-doc-btn-primary">Registrarse</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="public-doc-main">
    {% block portal_content %}{% endblock %}
  </main>
</div>
{% endblock %}
